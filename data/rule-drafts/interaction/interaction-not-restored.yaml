  instructions: "TODO: When a dialog closes, focus must return to the element that opened it (the trigger). If it does not, keyboard and screen-reader users land on `<body>` and must tab from the top to recover their place. One of the most common accessibility bugs, and invisible to mouse users. Radix and react-aria handle it automatically; hand-rolled dialogs almost never do."
