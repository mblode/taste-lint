# Hand-authored from shadcn-ui/lint (shadcn/no-raw-colors). The rule is re-expressed over
# slop-cop's extracted class lists; the original runs as an ESLint or oxlint plugin.
id: craft-raw-colour-class
title: Palette colour with a numeric shade instead of a theme token
categoryId: colour-system
domain: craft
source:
  repo: shadcn-ui/lint
  path: README.md
  line: 1
  ruleId: shadcn/no-raw-colors
scope:
  include: ["**/*.tsx", "**/*.jsx"]
  exclude:
    ["**/*.test.*", "**/*.spec.*", "**/*.stories.*", "**/components/ui/**"]
unit: [class-list]
tier: mechanical
mechanical: { function: rawColourClass }
severity: minor
fix:
  mode: none
  hint: >-
    Use the theme token (bg-primary, text-muted-foreground, border-destructive). A raw bg-pink-500 escapes the colour system and ignores dark mode.
status: review-only
handWritten: [mechanical, fix, status, scope]
