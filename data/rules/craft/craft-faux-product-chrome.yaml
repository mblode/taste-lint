review:
  applicability: Decorative browser or device chrome presents itself as a product preview.
  exceptions: Real screenshots, video, rendered product content, labeled status dots, and intentionally illustrative examples.
  evidence: Adjacent dot elements and labels, frame children, and the content being represented.
  verification: Confirm the preview depicts real product content or remove the misleading frame while preserving legitimate illustrations.
