# Hand-written from the lazy-hero sentence in mblode/agent-skills
# skills/ui-design/rules/perf-image-dimensions-and-priority.md. The source finds
# the first-viewport image by reading the page; the regex stands in with the
# names a hero usually carries. The case-insensitive match is written out as
# letter classes so the regex compiles on Node 22 and 24 alike.
id: craft-lazy-load-offscreen
title: Hero or above-the-fold image marked loading lazy
categoryId: resilience
source:
  repo: mblode/agent-skills
  path: skills/ui-design/rules/perf-image-dimensions-and-priority.md
  line: 21
scope:
  include:
    - "**/*.tsx"
    - "**/*.jsx"
unit: [source]
mechanical:
  flags: gus
  regex:
    "<(?:img|Image)\\b(?=[^>]*loading=\"lazy\")(?=[^>]*(?:[Hh]ero|[Bb]anner|[Cc]over|[Mm]asthead\
    |[Pp]riority))[^>]*>"
severity: minor
fix:
  hint: >-
    Never lazy-load the largest above-the-fold image; it delays the largest contentful paint. Load the hero eagerly (priority) and keep loading="lazy" for images below the fold.
status: review-only
handWritten: [mechanical, fix, status]
review:
  applicability: A lazy-loaded image may be needed in the initial viewport.
  exceptions: Below-the-fold covers or banners and images hidden until a later interaction.
  evidence: Actual viewport position, responsive visibility, loading priority, and page performance traces.
  verification: Load at supported viewport sizes under throttling and confirm the initial image loads promptly without eagerly loading offscreen content.
  sourceHash: e4b5361e710bdc0a2336756c43d9c418e399ac6b3ed893ebaa926c60426c0039
