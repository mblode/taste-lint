# Hand-authored from shadcn-ui/lint (shadcn/no-arbitrary-values). The rule is re-expressed over
# slop-cop's extracted class lists; the original runs as an ESLint or oxlint plugin.
# The typography pack reads arbitrary values on purpose; this rule is the
# design-system view of the same class and stays review-only.
id: craft-arbitrary-value-class
title: Arbitrary value in a utility class
categoryId: look-constraints
domain: craft
source:
  repo: shadcn-ui/lint
  path: README.md
  line: 1
  ruleId: shadcn/no-arbitrary-values
scope:
  include: ["**/*.tsx", "**/*.jsx"]
  exclude:
    ["**/*.test.*", "**/*.spec.*", "**/*.stories.*", "**/components/ui/**"]
unit: [class-list]
tier: mechanical
mechanical: { function: arbitraryValueClass }
severity: minor
fix:
  mode: none
  hint: >-
    Step the scale (p-3, text-sm, rounded-md) or register the value in the theme so the next component can reach it by name. p-[13px] is a nudge, not a decision.
status: review-only
handWritten: [mechanical, fix, status, scope]
