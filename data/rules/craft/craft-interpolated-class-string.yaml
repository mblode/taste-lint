# Hand-authored from shadcn-ui/lint (shadcn/require-static-classes). The rule is re-expressed over
# slop-cop's extracted class lists; the original runs as an ESLint or oxlint plugin.
id: craft-interpolated-class-string
title: Class name built from a template expression
categoryId: look-constraints
domain: craft
source:
  repo: shadcn-ui/lint
  path: README.md
  line: 1
  ruleId: shadcn/require-static-classes
scope:
  include: ["**/*.tsx", "**/*.jsx"]
  exclude:
    ["**/*.test.*", "**/*.spec.*", "**/*.stories.*", "**/components/ui/**"]
unit: [class-list]
tier: mechanical
mechanical: { function: interpolatedClassString }
severity: minor
fix:
  mode: none
  hint: >-
    Tailwind only generates classes it can read in full. Map the variable to complete class names (a lookup object or cva variants) instead of bg-${color}-500.
status: review-only
handWritten: [mechanical, fix, status, scope]
