    repo: mblode/agent-skills,
    path: skills/ui-design/guidelines/copywriting.md,
    line: 17,
  }
unit: [paragraph, heading, jsx-text, attr-string]
mechanical:
  regex: "\\.\\.\\."
  flags: gu
severity: minor
fix:
  function: ellipsis
  hint: Use the single ellipsis character (U+2026), for example "Saving…".
preconditions:
