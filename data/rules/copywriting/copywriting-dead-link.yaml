# Four of five models wrote href="#" on nav and CTA links (2026-09-23 generation
# test). Demo and registry files use it on purpose, so they are excluded.
id: copywriting-dead-link
title: Link with nowhere to go
categoryId: page-structure
source:
  repo: mblode/agent-skills
  path: skills/ui-design/rules/nav-semantic-links.md
  line: 10
  ruleId: nav-semantic-links
scope:
  include: ["**/*.tsx", "**/*.jsx"]
  exclude: ["**/examples/**", "**/registry/**", "**/*demo*"]
unit: [source]
mechanical:
  regex: href=["']#["']
  flags: gu
severity: major
fix:
  hint: Point the link at the route its label names. If there is none yet, it is not a link; cut it or make it a button that does the thing.
status: review-only
review:
  applicability: "A link or CTA whose href is a bare #."
  exceptions: "Placeholder links in a demo, story or registry example."
  evidence: "The link label and where the product actually sends that action."
  verification: "Confirm the label names a real destination, then point the link there or remove it."
