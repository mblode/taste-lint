question:
  context: []
  instructions: >-
    Read the TEXT. Return true when it reads as generated boilerplate: a chatbot opener or preamble ("I'd be happy to", "Let's dive in", "Here is some copy for"), a vague attribution ("experts believe", "studies show") with no source, a stock flourish ("game-changer", "unlock the power of", "in today's fast-paced world", "a testament to"), a sentence that announces its own importance instead of making the point ("here is where it gets interesting", "the implications are significant"), a false contrast that denies a claim nobody made ("not just a tool, it is a way of working"), or a symmetrical both-sides summary that adds no information. Return false when the TEXT makes a specific claim with a named source, gives an instruction, tells a concrete story, or quotes these phrases in order to warn against them.
  criteria:
    true:
      what: Generated boilerplate.
      examples:
        - "In today's fast-paced world, experts believe seamless collaboration is a game-changer."
        - "I'd be happy to help! Let's dive into how you can unlock the power of your data."
        - "This tool is a testament to the evolving landscape of modern software."
    false:
      what: Specific, sourced, instructional or quoting the tell.
      examples:
        - "Mike Taylor ran 27 articles through Jev in 0.7 seconds for a quarter of a cent."
        - "Run the migration, then restart the worker."
        - "Chatbot openers like I'd be happy to are the first tell to cut."
severity: minor
fix:
  hint: Ask what the sentence means and write that. Replace the abstraction with a fact (a number, a name, an outcome) or cut it. Never a synonym swap; the tell was never the word.
preconditions:
  {
    notInCode: true,
