  regex: <(div|span|li)\b[^>]*\bonClick=\{[^}]*(router\.push|navigate\(|location\.href)
severity: minor
fix:
  hint: Navigation should use `<a>` or framework `<Link>`, not click handlers on generic elements. A click handler on a div loses middle-click, open-in-new-tab, copy-link, and the browser's own back behaviour.
status: review-only
review:
  applicability: Navigation is exposed through a generic element's click handler.
  exceptions: A redundant card shortcut around an accessible real link can be intentional.
  evidence: The actual destination, nested links, handler behavior, and keyboard or browser navigation options.
  verification: Verify keyboard navigation, open-in-new-tab, and copy-link behavior while preserving legitimate larger click targets.
