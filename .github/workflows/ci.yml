name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Two parallel jobs: the Next.js build is CPU-bound and was the longest step
# on the old single job's path. Ledger: docs/audits/ci-speed.md.
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Lists pending changesets against origin/main. Skipped while the
      # repository has no main branch, since changesets needs that ref.
      - name: Changeset Status
        # The version PR consumes changesets to generate its bump and changelog.
        if: github.event_name == 'pull_request' && github.head_ref != format('changeset-release/{0}', github.event.repository.default_branch)
        run: |
          if git rev-parse --verify --quiet origin/main >/dev/null; then
            npx changeset status --since origin/main
          else
            echo "origin/main does not exist yet; skipping changeset status"
          fi

      # verify:full locally is verify:cli plus verify:web: check, build,
      # typecheck, test, packed smoke test, rules check, fixture dry run.
      - name: Verify
        run: npm run verify:cli

      - name: Checkout current agent-skills catalogue
        uses: actions/checkout@v6
        with:
          repository: mblode/agent-skills
          path: .work/agent-skills

      - name: Check ported rules against the current catalogue
        run: npm run port-rules -- --skills-dir .work/agent-skills --check

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify:web
