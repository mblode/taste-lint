name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Lists pending changesets against origin/main. Skipped while the
      # repository has no main branch, since changesets needs that ref.
      - name: Changeset Status
        if: github.event_name == 'pull_request'
        run: |
          if git rev-parse --verify --quiet origin/main >/dev/null; then
            npx changeset status --since origin/main
          else
            echo "origin/main does not exist yet; skipping changeset status"
          fi

      # The same umbrella a developer runs locally: check, typecheck, test,
      # build, packed smoke test, rules check, fixture dry run.
      - name: Verify
        run: npm run verify:full

      - name: Checkout current agent-skills catalogue
        uses: actions/checkout@v6
        with:
          repository: mblode/agent-skills
          path: .work/agent-skills

      - name: Check ported rules against the current catalogue
        run: npm run port-rules -- --skills-dir .work/agent-skills --check
